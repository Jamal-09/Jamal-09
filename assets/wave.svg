  </path>

  <circle cx="150" cy="60" r="2" fill="#c4b5fd"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
  <circle cx="420" cy="36" r="1.4" fill="#67e8f9"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin=".9s" repeatCount="indefinite"/></circle>
  <circle cx="760" cy="54" r="1.8" fill="#f9a8d4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.8s" begin="1.6s" repeatCount="indefinite"/></circle>
  <circle cx="980" cy="30" r="2" fill="#93c5fd"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" begin=".5s" repeatCount="indefinite"/></circle>
  <circle cx="600" cy="22" r="2.2" fill="#f5d0fe"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" begin="2.2s" repeatCount="indefinite"/></circle>
