<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img" aria-label="Initiate contact — the channel is open">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0524"/><stop offset=".55" stop-color="#070316"/><stop offset="1" stop-color="#0a0f2e"/></linearGradient>
    <linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#e9d5ff"/><stop offset=".5" stop-color="#a5f3fc"/><stop offset="1" stop-color="#fbcfe8"/></linearGradient>
    <radialGradient id="core"><stop offset="0" stop-color="#7c3aed" stop-opacity=".45"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <clipPath id="card"><rect x="1" y="1" width="678" height="298" rx="22"/></clipPath>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .k{font:600 12px ui-monospace,'Cascadia Code','SF Mono',Menlo,Consolas,monospace;letter-spacing:7px;fill:#8b5cf6}
    .t{font:700 36px 'Space Grotesk','Segoe UI',Inter,system-ui,sans-serif;letter-spacing:3px;fill:url(#title)}
    .p{font:15px 'Space Grotesk','Segoe UI',Inter,system-ui,sans-serif;fill:#aeb4c8}
    .o{font:700 13px ui-monospace,'Cascadia Code','SF Mono',Menlo,Consolas,monospace;letter-spacing:5px;fill:#a5f3fc}
    .ring{fill:none;stroke:#8b5cf6;transform-origin:340px 120px;animation:r 4.5s ease-out infinite}
    .r2{animation-delay:1.5s} .r3{animation-delay:3s}
    .dot{animation:bl 1.4s ease-in-out infinite}
    .dash{stroke-dasharray:6 10;animation:mv 1.2s linear infinite}
    @keyframes r{0%{transform:scale(.2);opacity:.7}100%{transform:scale(2.6);opacity:0}}
    @keyframes bl{0%,100%{opacity:1}50%{opacity:.2}}
    @keyframes mv{to{stroke-dashoffset:-32}}
  </style>
  <rect x="1" y="1" width="678" height="298" rx="22" fill="url(#bg)"/>
  <g clip-path="url(#card)">
    <circle cx="340" cy="120" r="200" fill="url(#core)"/>
    <circle class="ring" cx="340" cy="120" r="90" stroke-width="1.2"/>
    <circle class="ring r2" cx="340" cy="120" r="90" stroke-width="1.2"/>
    <circle class="ring r3" cx="340" cy="120" r="90" stroke-width="1.2"/>
  </g>
  <rect x="1" y="1" width="678" height="298" rx="22" fill="none" stroke="url(#edge)" stroke-opacity=".6" stroke-width="1.5"/>
  <text x="340" y="54" text-anchor="middle" class="k">// FINAL MODULE</text>
  <text x="340" y="108" text-anchor="middle" class="t" filter="url(#glow)">INITIATE CONTACT</text>
  <text x="340" y="152" text-anchor="middle" class="p">Building something ambitious — an app that needs to move,</text>
  <text x="340" y="176" text-anchor="middle" class="p">a system that needs to scale?</text>
  <line x1="150" y1="222" x2="250" y2="222" stroke="#22d3ee" stroke-opacity=".6" class="dash"/>
  <line x1="430" y1="222" x2="530" y2="222" stroke="#22d3ee" stroke-opacity=".6" class="dash"/>
  <circle class="dot" cx="252" cy="222" r="4.5" fill="#4ade80"/>
  <text x="348" y="227" text-anchor="middle" class="o">CHANNEL OPEN</text>
  <text x="340" y="268" text-anchor="middle" style="font:11px ui-monospace,'Cascadia Code','SF Mono',Menlo,Consolas,monospace;letter-spacing:4px;fill:#64748b">▼ PICK A FREQUENCY ▼</text>
</svg>
